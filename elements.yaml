# IT4IT 3.0 value-stream reference model, vendored as YAML in this repo's
# authoring schema (id / type / name / desc / props — see
# frictionless-architect's architecture/model/README.md for the schema this
# mirrors). Sourced from the Open Group's own reference model
# (it4it-fixed.xml): the root "IT4IT Value Streams" wrapper, its 7 value
# streams (a Flow network, not a pipeline), their 28 stages, and the outcomes
# each realizes. Every id is `it4it-`-prefixed for uniqueness when merged
# into a consuming project's det_id()/NS pass — see ADR-0029 in
# frictionless-architect. Tagged `props: {source: it4it}` throughout.

- {type: ValueStream, id: it4it-vs-root, name: "IT4IT: Value Streams", desc: The root wrapper composing all 7 IT4IT value streams., props: {source: it4it}}
- {type: Outcome, id: it4it-outcome-digital-product, name: "IT4IT: Digital Product", props: {source: it4it}}

- type: ValueStream
  id: it4it-vs-explore
  name: "IT4IT: Explore"
  desc: >-
    The value stream "Explore" is performed on the Scope Agreements developed in
    the Evaluate value stream. It ensures that all planned and accepted Portfolio
    Backlog Items are further detailed, budgeted, and sourced for Digital
    Products. This value stream continuously explores new features and/or future
    directions of a Digital Product aligned with strategic direction and business
    needs. It ensures that the Product Design evolves to facilitate innovation and
    optimize business outcomes.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-evaluate
  name: "IT4IT: Evaluate"
  desc: >-
    The value stream "Evaluate" contributes to the business strategy and portfolio
    planning activities. It provides a blueprint for optimizing products,
    services, and investment Portfolio Management. This value stream is focused on
    the continuous assessment and evaluation of the entire Digital Product
    Portfolio to optimize co-creation and alignment of business and technology
    Strategic Objectives.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-integrate
  name: "IT4IT: Integrate"
  desc: >-
    The value stream "Integrate" creates a new Product Release. It covers the
    planning, design, development (or configuration), and testing of a new Product
    Release (in non-production environments), and makes the Product Release
    available for deployment and release into production. A new Product Release
    can also be related to an emergency fix needed to resolve a production issue
    (such as resolving vulnerabilities and critical bugs).
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-deploy
  name: "IT4IT: Deploy"
  desc: >-
    The value stream "Deploy" is installing a Product Release into production. It
    can also imply the removal, disposal, or updating of an existing installed
    Product Release, so it is made available or unavailable to the customer. Many
    possible strategies for deploying a Product Release can be scenarios within
    the Deploy value stream; for example, deployment to a targeted audience, or
    deployment using a dark launch in which functionality is not directly released
    to consumers. If the user requirements and/or the characteristics of the
    Digital Product demand that the installed Product Release is improved,
    released, and deployed frequently, a drive to automate these value streams can
    emerge. To comply with regulatory requirements, organizations can require
    approvals and an audit trail of all the Changes made in production
    environments. The Deploy value stream ensures that all changes are tracked and
    related to a specific Product Release.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-release
  name: "IT4IT: Release"
  desc: >-
    The value stream "Release" ensures that the Service Offers for ordering a new,
    a change in, or the decommissioning of an Actual Product Instance or its
    support to them are offered to consumers. The Release value stream maintains
    the Service Offer Catalog, the catalog views, and the Service Offer promotion
    and information of available Service Offers to the consumer base so that the
    individual consumer can find and order Digital Products, or support for them.
    Service Offers should be made available for viewing and requests for access
    over multiple channels. This value stream publishes the Service Offers based
    on various triggers and inputs, such as:
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-operate
  name: "IT4IT: Operate"
  desc: >-
    The value stream "Operate" monitors and ensures that the availability and
    performance of Actual Product Instances are within the boundaries of their
    agreed Service Contract and Key Performance Indicator (KPI) targets. The scope
    of this value stream includes managing any compliance and security aspects of
    running Digital Product Instances and underlying systems that may result from
    deployment and/or fulfillment. The IT4IT Standard describes how to achieve
    this using integrated, automated, or fully autonomous data flows between the
    event monitoring (Event, Incident, Change, Configuration, and Problem
    Management) functions of the digital services. In addition, the data flows may
    be designed to be reactive, proactive, or predictive, and include a
    retrospective.
  props: {source: it4it}

- type: ValueStream
  id: it4it-vs-consume
  name: "IT4IT: Consume"
  desc: >-
    The value stream "Consume" manages the lifecycle of consuming a Digital
    Product. Digital Products are consumed as services and the lifecycle is
    managed as a Subscription to the service.
  props: {source: it4it}

- {type: ValueStream, id: it4it-explore-architecture, name: "Explore: Define Digital Product Architecture", props: {source: it4it}}
- type: ValueStream
  id: it4it-explore-refine-backlog
  name: "Explore: Refine Product Backlog"
  desc: >-
    The purpose of the value stream stage "Refine Product Backlog" is to translate
    a Scope Agreement into smaller pieces of work that can be assigned to product
    level features and linked to the product backlog. This includes organizing
    assigned backlog items into work packages and adjusting the Scope Agreement,
    business case, and budget as needed. The deliverables for this value stream
    stage are established Architecture Roadmap Items.
  props: {source: it4it}
- type: ValueStream
  id: it4it-explore-prioritize-backlog
  name: "Explore: Prioritize Backlog Items"
  desc: >-
    The purpose of the value stream stage "Prioritize Backlog Items" is to refine
    qualified Portfolio Backlog Items and mandates for new or existing Digital
    Product investment decisions. The budget allocated in the Evaluate value
    stream for the Product Portfolio is used to explore Digital Product ideas and
    determine feasibility. This should include ensuring that scoped Product
    Backlog Items deliver value, mitigate risks, and meet governance criteria
    (technology, security, reliability, supportability, etc.). The deliverables
    for this value stream stage are a Scope Agreement with prioritized Product
    Backlog Items; scope and timing refined.
  props: {source: it4it}
- type: ValueStream
  id: it4it-explore-roadmap
  name: "Explore: Finalize Roadmap & Scope Agreement"
  desc: >-
    The purpose of the value stream stage "Finalize Roadmap & Scope Agreement" is
    to assign work and begin to conduct planning meetings on a regular cadence.
    Stakeholder buy-in and agreement to the Release roadmap and outcomes must be
    obtained. This includes setting up tracking and reporting on progress. The
    deliverables for this value stream stage are an approved Architecture Roadmap
    and outcomes.
  props: {source: it4it}

- type: ValueStream
  id: it4it-evaluate-influencers
  name: "Evaluate: Gather Influencers"
  desc: >-
    The purpose of the value stream stage "Gather Influencers" is to bring
    together inputs for a planning cycle. Typical inputs include: consumer demand,
    improvement ideas, new technology opportunities, technology lifecycle events
    (e.g., end-of-life), and any known policy (legal and regulatory demands) or
    budget constraints for the Digital Product Portfolio. Other inputs may include
    an internal and/or external environmental scan to identify strengths,
    weaknesses, opportunities, and threats. Discussion with the business is
    centered on Digital Product value delivery for consumers and corresponding
    policy requirements. The deliverable for this value stream stage is new or
    updated Strategic Themes and/or Strategic Objectives.
  props: {source: it4it}
- type: ValueStream
  id: it4it-evaluate-backlog-mandates
  name: "Evaluate: Define Backlog Mandates"
  desc: >-
    The purpose of the value stream stage "Define Backlog Mandates" is to
    determine if there are any mandates or directives that will impact the Product
    Portfolio, and to ensure mandates are clearly defined in backlog items and
    related in Scope Agreements. This should include a review of the existing
    portfolio and managed service provider agreements. Portfolio rationalization
    to balance the portfolio should be completed regularly and may generate
    backlog items that are bundled into Scope Agreements. Upon approval to proceed
    on a Scope Agreement, initial funding is allocated to the Explore value stream
    to identify concerns specific to a Digital Product and determine feasibility.
    The deliverables for this value stream stage are refined Scope Agreements to
    reflect mandates and defined Architecture Roadmap Items.
  props: {source: it4it}
- {type: ValueStream, id: it4it-evaluate-governance, name: "Evaluate: Ensure Governance", props: {source: it4it}}
- {type: ValueStream, id: it4it-evaluate-gaps, name: "Evaluate: Identify Gaps", props: {source: it4it}}
- type: ValueStream
  id: it4it-evaluate-investments
  name: "Evaluate: Propose Investments"
  desc: >-
    The purpose of the value stream stage "Propose Investments" is to prioritize a
    list of opportunities and associated Scope Agreements. The prioritization
    should be based on a scoring method that considers business value, risk,
    costs, time, and resource availability. Scope Agreements are evaluated to
    determine if there is already a solution in the Product Portfolio that can be
    used or modified to satisfy the business need. If it is determined that there
    is not an existing solution and the new demand is in alignment with the
    digital strategy, the Scope Agreement is assessed against other work in the
    Portfolio Backlog and prioritized accordingly. The prioritization criteria
    should also consider factors like urgency and the impact of opportunities. The
    deliverable for this value stream stage is updated Scope Agreements with
    clarifications discovered during a prioritization of opportunities.
  props: {source: it4it}

- type: ValueStream
  id: it4it-integrate-plan-release
  name: "Integrate: Plan Product Release"
  desc: >-
    The purpose of the value stream stage "Plan Product Release" is to plan all
    development and testing activities required for creating the Product Release.
    Multiple teams may be needed, and different development methodologies may be
    used. This value stream stage is revisited as it oversees the other value
    stream stages in this value stream to cater for changes in the planning and
    iterations of the Design & Develop value stream stage.
  props: {source: it4it}
- type: ValueStream
  id: it4it-integrate-design-develop
  name: "Integrate: Design & Develop"
  desc: >-
    The purpose of the value stream stage "Design & Develop" is to analyze the
    requirements, create (or update) the design artifacts, and develop the changes
    (and associated Test Cases) for the Product Release. This includes the coding
    and configuration of software and related infrastructure (e.g., infrastructure
    as code).
  props: {source: it4it}
- {type: ValueStream, id: it4it-integrate-build-test, name: "Integrate: Build, Integrate, & Test", props: {source: it4it}}
- type: ValueStream
  id: it4it-integrate-accept-publish
  name: "Integrate: Accept & Publish Release"
  desc: >-
    The purpose of the value stream stage "Accept and Publish Release" is to
    accept the Product Release as a candidate for deployment into production. The
    required change authority, such as the Product Manager, accepts the Product
    Release for deployment and/or release into production. The Product Manager
    accepts the Product Release after engaging with relevant stakeholders, which
    includes reviewing test results to accept or reject the list of remaining
    Defects, and reviewing the collateral produced. In a DevOps model, Operations
    has been participating all along but at this point an approval is given for
    the Product Release to be deployed into production.
  props: {source: it4it}

- type: ValueStream
  id: it4it-deploy-plan-approve
  name: "Deploy: Plan & Approve Deployment"
  desc: >-
    The purpose of the value stream stage "Plan & Approve Deployment" is to create
    a deployment plan for a Digital Product and, based on this plan, to sign it
    off with all relevant stakeholders.
  props: {source: it4it}
- type: ValueStream
  id: it4it-deploy-fulfill
  name: "Deploy: Fulfill Deployment"
  desc: >-
    The purpose of the value stream stage "Fulfill Deployment" is to execute the
    Fulfillment Orchestration when the change window for deployment is open. The
    Fulfillment Orchestration is documented in the change records and can be coded
    as part of the Product Release to automate the Fulfillment Orchestration.
  props: {source: it4it}
- {type: ValueStream, id: it4it-deploy-observe, name: "Deploy: Observe Deployment", props: {source: it4it}}
- type: ValueStream
  id: it4it-deploy-validate
  name: "Deploy: Validate Deployment"
  desc: >-
    The purpose of the value stream stage "Validate Deployment" is to ensure that
    all aspects of the deployment activities were correctly executed. This
    includes checking that the Product Instance is indeed running and configured
    according to plan, and that the monitoring and documentation associated is
    configured and made available.
  props: {source: it4it}

- type: ValueStream
  id: it4it-release-define-offer
  name: "Release: Define Service Offer"
  desc: >-
    The purpose of the value stream stage "Define Service Offer" is to obtain the
    Service Offer information from the Integrate value stream and to plan the
    creation and publication of Service Offers to Consumers. Offers can also
    represent the consumption of cloud services making the Service catalog an
    Aggregation catalog between their own and cloud services; planning should take
    place to identify which cloud Service Offers would be made available.
  props: {source: it4it}
- type: ValueStream
  id: it4it-release-implement-offer
  name: "Release: Implement Service Offer"
  desc: >-
    The purpose of the value stream stage "Implement Service Offer" is to onboard
    the Service Offer into the Service Offer Catalog and to prepare all that is
    needed so that the Service Offer can be published.
  props: {source: it4it}
- type: ValueStream
  id: it4it-release-publish-offer
  name: "Release: Publish Service Offer"
  desc: >-
    The purpose of the value stream stage "Publish Service Offer" is to activate
    or release the Service Offer so that it can be ordered by consumers.
  props: {source: it4it}

- type: ValueStream
  id: it4it-operate-detect
  name: "Operate: Detect Issue"
  desc: >-
    The purpose of the value stream stage "Detect Issue" is to detect issues in an
    Actual Product Instance or system that has caused or may cause degradation of
    the service or breach the agreed service levels, then to prioritize and assign
    them for further diagnosis in a structured and repeatable manner.
  props: {source: it4it}
- type: ValueStream
  id: it4it-operate-diagnose
  name: "Operate: Diagnose Issue"
  desc: >-
    The purpose of the value stream stage "Diagnose Issue" is to prepare the
    best/quickest course of action to retain or restore normal operations. Further
    diagnosis can be performed to identify the root cause(s) of a potential or
    detected issue.
  props: {source: it4it}
- type: ValueStream
  id: it4it-operate-resolve
  name: "Operate: Resolve Issue"
  desc: >-
    The purpose of the value stream stage "Resolve Issue" is to execute the
    (prepared) course of action to retain, restore, and confirm normal service
    operations.
  props: {source: it4it}

- {type: ValueStream, id: it4it-consume-publish-status, name: "Consume: Publish Service Status", props: {source: it4it}}
- {type: ValueStream, id: it4it-consume-support, name: "Consume: Provide Service Support", props: {source: it4it}}
- type: ValueStream
  id: it4it-consume-agree-offer
  name: "Consume: Agree to Service Offer"
  desc: >-
    The purpose of the value stream stage "Agree to Service Offer" is to get
    agreement from the customer to the terms and conditions of the Service
    Contract.
  props: {source: it4it}
- type: ValueStream
  id: it4it-consume-subscribe-offer
  name: "Consume: Subscribe to Service Offer"
  desc: >-
    The purpose of the value stream stage "Subscribe to Service Offer" is to make
    the Actual Product Instance, as result of the Order and Desired Product
    Instance, available to the customer, in such a way that the customer is able
    to consume the Digital Product.
  props: {source: it4it}
- type: ValueStream
  id: it4it-consume-select-offer
  name: "Consume: Select an Offer"
  desc: >-
    The purpose of the value stream stage "Select an Offer" is to help the
    customer to select the Digital Product Service Offers(s) best suited to their
    needs.
  props: {source: it4it}

# --- Capabilities reachable from a stage via the source model's own
#     DataObject -> Resource -> Capability chain (Realization; Realization;
#     Assignment) — see relationships.yaml section D for the derived
#     Stage<-Capability edges these back. ---
- type: Capability
  id: it4it-cap-architecture-mgmt
  name: "IT4IT: Architecture Management"
  desc: >-
    The ability to manage architecture is required to effectively describe the
    as-is and target architecture or 'blueprints' of the enterprise, to define the
    policies and standards used by it, and govern solution compliance to the
    defined architecture, policies, and standards. At an enterprise level, it
    includes enterprise architecture, the sub-domain specialties of enterprise
    architecture; at a tactical or service level, it includes solution
    architecture, service architecture, and systems (technology) architecture. The
    purpose of the Manage Architecture Capability is to use architecture policies
    and artifacts to provide the organization: - The ability to steer strategic
    decisions toward wanted positions and business outcomes (the future state) -
    The ability to proactively and holistically lead enterprise responses to
    business strategies and external drivers. - The ability to present business
    and IT leaders with recommendations to achieve target business outcomes and
    secure implementation of the transition roadmap.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-asset-mgmt
  name: "IT4IT: Asset Management"
  desc: >-
    The ability to track and report the value and ownership of capital assets
    throughout their life cycle.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-config-mgmt
  name: "IT4IT: Configuration Management"
  desc: >-
    The ability to maintain information about Configuration Items required to
    deliver an IT Service, including their Relationships. This information is
    managed throughout the Lifecycle of the CI.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-defect-mgmt
  name: "IT4IT: Defect Management"
  desc: >-
    The ability to keep track of all Defects by registering Defects of all types
    (including security-related Defects). It analyzes Defects and finds
    resolutions. It also associates Defects with Requirements.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-demand-mgmt
  name: "IT4IT: Demand Management"
  desc: >-
    The ability to understand and influence Customer demand for Services and the
    provision of Capacity to meet these demands. At a Strategic level Demand
    Management can involve analysis of Patterns of Business Activity and User
    Profiles. At a tactical level it can involve use of Differential Charging to
    encourage Customers to use IT Services at less busy times.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-event-mgmt
  name: "IT4IT: Event Management"
  desc: >-
    The capability to manage Events throughout their Lifecycle. Event Management
    is one of the main Activities of IT Operations.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-financial-mgmt
  name: "IT4IT: Financial Management"
  desc: >-
    The ability to manage an IT Service Provider’s financial accounts and to bill
    for and accept payment for services, or to make payment for services purchased
    and rendered. In an external provider archetype, may also include vetting of
    consumer credit applications and tax accounting.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-incident-mgmt
  name: "IT4IT: Incident Management"
  desc: >-
    The ability responsible for managing the Lifecycle of all Incidents. The
    primary Objective of Incident Management is to return the IT Service to
    Customers as quickly as possible.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-measurement-reporting
  name: "IT4IT: Measurement & Reporting"
  desc: >-
    Measurement & Reporting is the ability to consolidate information across the
    various value streams and functional components, to assess and evaluate
    metrics and KPIs, and provide service reporting, analytics, dashboards and
    scorecards.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-operations-mgmt
  name: "IT4IT: Operations Management"
  desc: >-
    The ability to perform activities carried out by IT Operations Control,
    including Console Management, Job Scheduling, Backup and Restore, and Print
    and Output Management. IT Operations is also used as a synonym for Service
    Operation
  props: {source: it4it}
- type: Capability
  id: it4it-cap-policy-mgmt
  name: "IT4IT: Policy Management"
  desc: >-
    The ability to define and maintain the policies, principles, rules and
    standards governing the implementation to be compliant towards the target
    state.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-problem-mgmt
  name: "IT4IT: Problem Management"
  desc: >-
    The ability to manage the Lifecycle of all Problems. The primary objectives of
    Problem Management are to prevent Incidents from happening, and to minimize
    the Impact of Incidents that cannot be prevented.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-procurement-mgmt
  name: "IT4IT: Procurement Management"
  desc: >-
    The ability to receive and execute purchase orders for supplies, equipment,
    products, and services, and to handle purchase exceptions.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-backlog-mgmt
  name: "IT4IT: Product Backlog Management"
  desc: >-
    The ability to plan, resource, and execute a sequenced set of activities of
    prescribed duration that are managed together to achieve a defined scope of
    deliverables and other outcomes within established time, budget, and quality
    parameters.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-design-mgmt
  name: "IT4IT: Product Design Management"
  desc: >-
    The ability to design new or changed service software functionality and data.
    Ability to identify the new or existing services required to meet the needs of
    the Scope Agreement and IT Initiative, including both service systems and
    service offers.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-development
  name: "IT4IT: Product Development"
  desc: >-
    The ability to implement new or changed software services application and data
    components by coding, code unit verification and defect correction.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-portfolio-mgmt
  name: "IT4IT: Product Portfolio Management"
  desc: >-
    The ability to create and manage the portfolio of services in plan,
    transition, production, and retirement with the aim to deliver the maximal
    aggregate value to the business objectives.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-release-mgmt
  name: "IT4IT: Release Management"
  desc: >-
    The ability to plan, schedule and control the movement and installation of
    release configurations to test and live environments, while ensuring that the
    integrity of the environment is protected and that the correct components are
    released.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-request-mgmt
  name: "IT4IT: Request Management"
  desc: >-
    The ability to provide a channel for users to request and receive offered
    services.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-requirements-mgmt
  name: "IT4IT: Requirements Management"
  desc: >-
    The ability to manage requirements through the lifecycle of a service. It
    collects, refines, scopes, and tracks progress of and maintains requirements
    before and after an IT Initiative(s) ha(s)(ve) been delivered. It maintains
    the traceability of each requirement to the original source (demand, IT or
    business standard or policy, and/or requestor) and to the source (code),
    solutions and/or test cases throughout the service lifecycle. Requirements can
    be maintained for different levels. For example: - At an enterprise level,
    external market business and IT requirements are maintained; - At a tactical
    or service automation level, software process and service automation
    requirements are managed; - At an operational level, performance and
    availability requirements are managed.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-service-catalog-mgmt
  name: "IT4IT: Service Catalog Management"
  desc: >-
    The ability to publish and maintain a database or structured Document with
    information about all Live IT Services, including those available for
    deployment. It also includes the set of services available for reuse in the
    development of applications and other services. The former are contracted for
    via SLA, the latter by OLA.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-service-level-mgmt
  name: "IT4IT: Service Level Management"
  desc: >-
    The ability to define and negotiate service warranties and qualities of
    service that comprise standard or custom service level offerings, and to
    govern compliance to them. SLM is responsible for ensuring that all IT Service
    Management Processes, Operational Level Agreements, and Underpinning
    Contracts, are appropriate for the agreed Service Level Targets. SLM monitors
    and reports on Service Levels, and holds regular Customer reviews.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-test-mgmt
  name: "IT4IT: Test Management"
  desc: >-
    The ability to plan and execute tests that ensure the IT service will support
    the customer’s requirements at the agreed service levels. It prepares test
    environment, plans and designs tests, and executes all functional and
    non-functional tests including performance and stress testing.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-vendor-mgmt
  name: "IT4IT: Vendor Management"
  desc: >-
    The ability to ensure that all Contracts and agreements with Internal and
    External Service Providers/Suppliers support the needs of the Business, and
    that all Internal and External Service Providers/Suppliers meet their
    contractual/agreed commitments.
  props: {source: it4it}

# --- Remaining IT4IT 3.0 capabilities not reached via the derivation chain
#     above (id-prefixed the same way; not yet linked to any stage or bridge
#     relationship). 7 of these have no documentation in the source. Excludes
#     the source model's one placeholder element literally named "Capability"
#     (no documentation, no relationships — a modelling artefact, not a real
#     domain concept). ---
- type: Capability
  id: it4it-cap-availability-mgmt
  name: "IT4IT: Availability Management"
  desc: >-
    The ability to define, analyze, Plan, measure and improve all aspects of the
    Availability of IT Services. Availability Management is responsible for
    ensuring that all IT Infrastructure, Processes, Tools, Roles, etc. are
    appropriate for the agreed Service Level Targets for Availability.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-capacity-mgmt
  name: "IT4IT: Capacity Management"
  desc: >-
    The ability to ensure that the Capacity of IT Services and the IT
    Infrastructure is able to deliver agreed Service Level Targets in a Cost
    Effective and timely manner. Capacity Management considers all Resources
    required to deliver the IT Service, and plans for short-, medium- and
    long-term Business Requirements. The Resources used by each IT Service and the
    pattern of usage over time are collected, recorded, and analyzed for use in
    the Capacity Plan.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-change-mgmt
  name: "IT4IT: Change Management"
  desc: >-
    The ability to control the lifecycle of all changes from request to
    resolution. The primary objective of Change Management is to enable beneficial
    Changes to be made with minimum disruption to Services.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-collaboration
  name: "IT4IT: Collaboration"
  desc: >-
    The Collaboration & Communication function supports many other IT4IT
    Functional Components by enabling optimal collaboration and communication
    between the various stakeholders and parties within the ecosystem, including
    internal and external collaboration with all parties in the digital
    ecosystem. Source: IT4IT 3.0.1 standard, section 10.6 (undocumented in the
    ArchiMate exchange file; pulled from the published standard PDF instead).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-compliance-mgmt
  name: "IT4IT: Compliance Management"
  desc: >-
    Part of the combined IT4IT Governance, Risk, & Compliance function: ensures
    that security, risk, and compliance are fully embedded into the digital
    delivery network, including all involved parties and vendors, with
    transparency and traceability of compliance information — including
    continuous monitoring of compliance, audit management (performing audits to
    identify issues and exceptions), and managing deviations/exceptions. Source:
    IT4IT 3.0.1 standard, section 10.2 (the standard does not define Compliance
    Management separately from Risk Management — see it4it-cap-risk-mgmt;
    undocumented in the ArchiMate exchange file).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-continuity-mgmt
  name: "IT4IT: Continuity Management"
  desc: >-
    The ability to manage improvements to IT Service Management Processes and IT
    Services. The Performance of the IT Service Provider is continually measured
    and improvements are made to Processes, IT Services and IT Infrastructure in
    order to increase Efficiency, Effectiveness, and Cost Effectiveness.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-contract-mgmt
  name: "IT4IT: Contract Management"
  desc: >-
    Manages the Contract — the relationship between provider and consumer
    created when an Offer is accepted and a Digital Product Instance is created
    — including all details required for financial recording, governance,
    measurement, charging, support, and servicing of that instance. Source:
    IT4IT 3.0.1 standard, sections 2.1 and 4.2.3. Caveat: the standard does not
    define a distinct "Contract Management" function or capability — this is
    adapted from its definitions of the Contract concept and the Contract
    Definition data object; contract management systems are explicitly called
    out as non-normative Supporting Capabilities supplied externally.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-customer-relationship-mgmt
  name: "IT4IT: Customer Relationship Management"
  desc: >-
    The ability to maintain relationships with service consumers. In an Internal
    IT Provider archetype, Business Relationship Management or BRM is the the
    capability to maintain a Relationship with the internal enterprise Line of
    Business Unit consumers and stakeholders. Business Relationship Management
    usually includes: - Managing personal Relationships with Business managers;
    Providing input to Service Portfolio Management - Ensuring that the IT Service
    Provider is satisfying the Business needs of the Customers. - In an External
    Service Provider context, Customer Relationship or CRM, which means it is the
    ability to do the BRM, except it is not with internal but with external
    customers and organizations.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-customer-support
  name: "IT4IT: Customer/User Support"
  desc: >-
    The ability to assist users with interactions to service support. The support
    capability is be provided via varity of media (e.g. click, call, face),
    assists VIP's, allows for self-help, has the ability to list current
    disruptions and routes interactions to the correct supporting agents.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-deployment-mgmt
  name: "IT4IT: Deployment Management"
  desc: >-
    Inferred, not sourced: the standard names no "Deployment Management"
    function or functional component anywhere — confirmed absent from both the
    ArchiMate exchange file and the full published IT4IT 3.0.1 standard PDF,
    and no definition could be found via web search either. This description
    is inferred from the Deploy value stream's stages (Plan & Approve, Fulfill,
    Observe, Validate): the ability to plan, execute, and validate the release
    of a Release Package into a target environment, and to observe and roll
    back that deployment if it fails validation. Treat this as a best-effort
    placeholder, not an authoritative IT4IT definition.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-identity-access-mgmt
  name: "IT4IT: Identity and Access Management"
  desc: >-
    The ability to design, develop manage, and control the security of automation
    services and information to meet requirements. The capability to ensure the
    Confidentiality, Integrity and Availability of an Organization’s Assets,
    information, data and IT Services. Authorization and Access Management usually
    forms part of an organizational approach to Security Management that has a
    wider scope than the IT Service Provider, and includes handling of paper,
    building access, phone calls, etc., for the entire organization.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-knowledge-mgmt
  name: "IT4IT: Knowledge Management"
  desc: >-
    The ability to gather, analyze, store and share knowledge and information
    within an Organization. The primary purpose of Knowledge Management is to
    improve Efficiency by reducing the need to rediscover knowledge.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-performance-mgmt
  name: "IT4IT: Performance Management"
  desc: >-
    The ability responsible for day-to-day Performance Management Activities.
    These include monitoring, threshold detection, Performance analysis and
    Tuning, and implementing changes related to Performance and Capacity.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-portfolio-backlog-mgmt
  name: "IT4IT: Portfolio Backlog Management"
  desc: >-
    The ability to provide lifecycle management and visibility of Portfolio
    Backlog Items as grouped into collections of work and prioritized;
    supports the Evaluate, Explore, and Integrate value streams. Source: IT4IT
    3.0.1 standard, section 6.2.1 "Portfolio Backlog Functional Component"
    (undocumented in the ArchiMate exchange file; pulled from the published
    standard PDF instead).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-product-sales-mgmt
  name: "IT4IT: Product Sales Management"
  desc: >-
    The ability to generate, accept, approve, and manage customer orders for
    products and services.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-risk-mgmt
  name: "IT4IT: Risk Management"
  desc: >-
    Part of the combined IT4IT Governance, Risk, & Compliance function: the
    ability to identify, classify, manage, and mitigate risk in an increasingly
    complex digital environment, including maintaining a risk register,
    performing risk assessments (including vendor risk), and defining and
    implementing mitigation plans. Source: IT4IT 3.0.1 standard, section 10.2
    (the standard does not define Risk Management separately from Compliance
    Management — see it4it-cap-compliance-mgmt; undocumented in the ArchiMate
    exchange file).
  props: {source: it4it}
- type: Capability
  id: it4it-cap-strategy-mgmt
  name: "IT4IT: Strategy Management"
  desc: >-
    The ability to create establish business strategies and business plans to
    increase customer value, to lead the direction for the organization into the
    future, to develop and harmonize the organizations strategic landscape and to
    develop competitive business strategies.
  props: {source: it4it}
- type: Capability
  id: it4it-cap-workforce-mgmt
  name: "IT4IT: Workforce Management"
  desc: >-
    Supports the HR Management aspects within the digital delivery model,
    ensuring the resource portfolio, skills, and competencies are aligned with
    the strategic direction — including onboarding/off-boarding, team
    administration, resource allocation, and employee career development.
    Source: IT4IT 3.0.1 standard, section 10.3 (undocumented in the ArchiMate
    exchange file; pulled from the published standard PDF instead).
  props: {source: it4it}

# --- The 4 canonical IT4IT value-stream domains, grouping the capabilities
#     above by home stream (source model's own Aggregation edges — the only
#     genuine cap-to-cap structure it carries; see relationships.yaml section D
#     for the edges and why the finer overlapping sub-groupings, e.g. "Assure"/
#     "Develop"/"Test", were left out). Grouping carries no layer semantics and
#     is exempt from viewpoint filtering, so it's safe on the Capability Map
#     view alongside the strict capability/outcome/resource allow-list. ---
- type: Grouping
  id: it4it-domain-strategy-to-portfolio
  name: "IT4IT: Strategy to Portfolio"
  desc: >-
    The value-stream domain covering the capabilities that shape enterprise and
    solution strategy into a governed portfolio of demand.
  props: {source: it4it}
- type: Grouping
  id: it4it-domain-requirement-to-deploy
  name: "IT4IT: Requirement to Deploy"
  desc: >-
    The value-stream domain covering the capabilities that take a requirement
    through design, development, and release readiness.
  props: {source: it4it}
- type: Grouping
  id: it4it-domain-request-to-fulfill
  name: "IT4IT: Request to Fulfill"
  desc: >-
    The value-stream domain covering the capabilities that take a customer
    request through to a fulfilled, billed service.
  props: {source: it4it}
- type: Grouping
  id: it4it-domain-detect-to-correct
  name: "IT4IT: Detect to Correct"
  desc: >-
    The value-stream domain covering the capabilities that detect, diagnose,
    and resolve operational issues to assure service delivery.
  props: {source: it4it}

