# IT4IT 3.0 reference views — one per standard ArchiMate viewpoint (value
# stream, capability, stakeholder, outcome realization), each covering only
# this model's own it4it-* elements. Loaded by the consuming project's
# build.py/render_diagrams.py alongside its own views.yaml (see ADR-0029 in
# frictionless-architect) — same schema: `id` / `name` / `viewpoint`
# (optional) / `diagram` (path under this repo's own diagrams/, no
# extension) / `members` and/or `include_types` / `no_direction` (optional).
# Touchpoint views bridging a consuming project's own elements to these
# belong in that project, not here — see view-it4it-capability-bridges in
# frictionless-architect's views.yaml.

- id: view-it4it-value-streams
  name: "IT4IT: Value Streams"
  viewpoint: value_stream
  diagram: vision/value-streams
  # The 7 streams and the outcome they jointly realize. No stage
  # decomposition — see the per-stream views below for that.
  # no_direction: [Flow] because Evaluate has a bidirectional Flow edge to
  # every other stream (12 of the 18 Flow edges) — a hub-and-spoke, not a
  # one-way sequence. Forcing the default Rel_Flow_Right rank hint fights
  # itself (both directions on the same pair), so let graphviz lay it out
  # freely instead. See architecture/model/README.md.
  no_direction: [Flow]
  members:
    - it4it-vs-root
    - it4it-vs-explore
    - it4it-explore-architecture
    - it4it-explore-refine-backlog
    - it4it-explore-prioritize-backlog
    - it4it-explore-roadmap
    - it4it-vs-evaluate
    - it4it-evaluate-influencers
    - it4it-evaluate-backlog-mandates
    - it4it-evaluate-governance
