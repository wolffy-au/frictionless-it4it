- id: view-it4it-capability-map
  name: "IT4IT: Capability Map"
  viewpoint: capability
  diagram: vision/capability-map
  # All 42 IT4IT 3.0 capabilities, plus the 4 canonical value-stream domain
  # Groupings that nest 34 of them (Aggregation, relationships.yaml)
  # — the only genuine cap-to-cap structure the source model carries. The
  # remaining 8 capabilities (compliance/risk/collaboration/contract/
  # deployment/portfolio-backlog/workforce-mgmt/financial-mgmt) sit outside
  # all 4 domains — the first 7 only ever appeared in the finer, overlapping
  # sub-groupings that were deliberately left out (see relationships.yaml);
  # financial-mgmt's only source aggregation was the erroneous
  # Request-to-Fulfill edge dropped as a bug fix (see relationships.yaml).
  members:
